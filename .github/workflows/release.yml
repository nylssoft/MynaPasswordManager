name: Release Myna PasswordManager
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish
      run: dotnet publish PasswordManager\PasswordManager.csproj --configuration Release --runtime win-x64 --no-self-contained --output PasswordManager\bin\publish\win-x64
    - name: Create release ZIP file
      run: Compress-Archive -Path PasswordManager\bin\publish\win-x64\* -Destination "MynaPasswordManager-win-x64-$env:RELEASE_TAG.zip"
    - name: Create github release
      run: gh release create "$env:RELEASE_TAG" "MynaPasswordManager-win-x64-$env:RELEASE_TAG.zip"
